name: Publish Android APK release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4

      - name: Verify packaged APK checksum
        working-directory: apks
        run: sha256sum --check SHA256SUMS

      - name: Publish prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            apks/FossPass-0.3.1-alpha-import-security-arm64-debug.apk \
            apks/SHA256SUMS \
            --verify-tag \
            --prerelease \
            --title "FossPass 0.3.1 alpha — import and storage security" \
            --notes "Android arm64-v8a prerelease. Debug-signed for testing only. Includes encrypted selectable app storage, duplicate-safe imports, and at-rest hardening."
