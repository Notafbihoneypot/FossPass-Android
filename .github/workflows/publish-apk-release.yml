name: Publish Android APK release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4

      - name: Verify packaged APK checksum
        working-directory: apks
        run: sha256sum --check SHA256SUMS

      - name: Publish prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            apks/FossPass-0.4.1-alpha-qr-scanner-arm64-debug.apk \
            apks/SHA256SUMS \
            --verify-tag \
            --prerelease \
            --title "FossPass 0.4.1 alpha — reliable Android QR scanner" \
            --notes "Android arm64-v8a prerelease. Debug-signed for testing only. Adds a live camera heartbeat, QR detection and collection progress, haptic frame confirmation, QR-only try-harder/inverted decoding, and slower lower-density animated frames."
