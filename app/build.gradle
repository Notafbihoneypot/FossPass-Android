plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id "org.mozilla.rust-android-gradle"
}

android {
    namespace 'org.fosspass'
    compileSdk 35
    ndkVersion "27.2.12479018"
    defaultConfig {
        applicationId 'org.fosspass'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.4.1-alpha-qr-scanner'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

cargo {
    module = "../crates/fosspass-core"
    libname = "fosspass_core"
    targets = ["arm64"]
    pythonCommand = "python3"
}

configurations.all {
    resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'com.google.android.gms:play-services-fido:21.1.0'
    implementation 'com.upokecenter:cbor:4.5.6'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.security:security-crypto:1.1.0'
    implementation 'net.java.dev.jna:jna:5.19.1@aar'

    // CameraX scanner + ZXing decoder for offline QR import.
    def camerax_version = "1.5.1"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // ZXing QR generation and camera-frame QR decoding.
    implementation 'com.google.zxing:core:3.5.4'
}
